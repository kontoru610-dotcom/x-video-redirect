
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Player</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.video-container {
  width: 100%;
  max-width: 464px;
  cursor: pointer;
  position: relative;
}

video {
  display: block;
  width: 100%;
  height: auto;
}
</style>
</head>

<body>

<div class="video-container" id="redirect">

  <video autoplay muted loop playsinline preload="auto">
    <source src="./video.mp4" type="video/mp4">
    Browser tidak mendukung video.
  </video>

</div>

<script>
document.getElementById("redirect")
.addEventListener("click", function() {
  window.location.href =
  "https://uc-share.com/s/8bc5cfe88ed74?la=id";
});
</script>

</body>
</html>
