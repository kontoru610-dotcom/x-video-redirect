

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Player</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
</style>
</head>

<body>

<video
  id="video"
  autoplay
  muted
  playsinline
  controls
  preload="auto"
>
  <source src="./video.mp4" type="video/mp4">
</video>

<script>
const video = document.getElementById("video");

video.addEventListener("click", function() {
  window.location.href =
  "https://uc-share.com/s/8bc5cfe88ed74?la=id";
});
</script>

</body>
</html>
